# 发布目录由 deploy/release.py 配置到 /srv/elm-current；只伺服构建产物。
server {
# 2026-09-13 入口处置结论：**保留 4001**。原占用方（同服务器另一项目 classroom-vote）
# 经负责人确认后已停用其站点（配置改名保留、可回退：/home/ubuntu/backups/nginx-20260913-4001switch/）。
    listen 4001;
    # 2026-09-14 双端演示：负责人要求 4001/4002 双入口同内容；4002 原占用方 student-profile 经确认停用（pm2 stop，可回退）。
    listen 4002;
    server_name _;
    root /srv/elm-current/www/merchant;
    charset utf-8;
    # 2026-09-15（D1）：放宽到 4m——后端 multipart max-file-size 为 2MB，恰好 2MB 的图片
    # 加上 multipart 边界与头部会超过 2m 而被 413 挡下。
    client_max_body_size 4m;
    location = /user { return 302 /user/; }
    location /user/api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /user/api/;
        add_header Cache-Control "no-store" always;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /api/;
        add_header Cache-Control "no-store" always;
    }
    location /user/ {
        alias /srv/elm-current/www/user/;
        try_files $uri $uri/ /user/index.html;
        add_header Cache-Control "no-cache";
    }
    location /demo/ {
        alias /srv/elm-current/www/demo/;
        index index.html;
        add_header Cache-Control "no-cache";
    }
    # 2026-09-15（D1）：评价/商品图片物理路径为后端的 /uploads/**，后端静态映射只监听 127.0.0.1:4000，
    # 浏览器直连会落到 SPA 回退返回 HTML（图片必然打不开），必须由 nginx 反代。
    # 双端演示页（服务器本地资产，仓库暂未收录）
    location /dual/ {
        alias /srv/elm-current/dual/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800";
    }
    location /demo-images/ { alias /srv/elm-current/www/user/demo-images/; }
    location /design-assets/ { alias /srv/elm-current/www/user/design-assets/; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}

# 2026-09-13：原「旧地址 5174 → 用户端」跳转块已**移除**——5174 现由同服务器另一项目
# （banwei-vote 的 node 服务）占用，nginx 在该块上 bind() 失败会导致**整次 reload 中止**
# （表现为配置已改但线上行为不变）；本项目入口统一为 4001。
