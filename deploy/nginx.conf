# 发布目录由 deploy/release.py 配置到 /srv/elm-current；只伺服构建产物。
server {
# 2026-09-13 入口处置结论：**保留 4001**。原占用方（同服务器另一项目 classroom-vote）
# 经负责人确认后已停用其站点（配置改名保留、可回退：/home/ubuntu/backups/nginx-20260913-4001switch/）。
    listen 4001;
    server_name _;
    root /srv/elm-current/www/merchant;
    charset utf-8;
    client_max_body_size 2m;
    location = /user { return 302 /user/; }
    location /user/api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /user/api/;
        add_header Cache-Control "no-store" always;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /api/;
        add_header Cache-Control "no-store" always;
    }
    location /user/ {
        alias /srv/elm-current/www/user/;
        try_files $uri $uri/ /user/index.html;
        add_header Cache-Control "no-cache";
    }
    location /demo/ {
        alias /srv/elm-current/www/demo/;
        index index.html;
        add_header Cache-Control "no-cache";
    }
    location /demo-images/ { alias /srv/elm-current/www/user/demo-images/; }
    location /design-assets/ { alias /srv/elm-current/www/user/design-assets/; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}

# 2026-09-13：原「旧地址 5174 → 用户端」跳转块已**移除**——5174 现由同服务器另一项目
# （banwei-vote 的 node 服务）占用，nginx 在该块上 bind() 失败会导致**整次 reload 中止**
# （表现为配置已改但线上行为不变）；本项目入口统一为 4001。
