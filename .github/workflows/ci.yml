name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-hygiene:
    name: 提交规范检查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "检查提交信息、test: 纯度与 daily 携带"
        run: bash .github/scripts/commit-hygiene.sh "origin/${{ github.base_ref }}"

  user-h5:
    name: 用户端（构建 + 单测）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/user-h5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/user-h5/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run
      - run: npm run build

  merchant-admin:
    name: 商家端（构建 + 单测）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/merchant-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/merchant-admin/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  backend-build:
    name: 后端（构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -DskipTests package

  # 2026-09-10 首次运行即通过（23 条后端测试），已由观察期提升为必需检查
  backend-test:
    name: 后端集成测试（MySQL）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: elm_practice_test
          MYSQL_USER: elm
          MYSQL_PASSWORD: elm
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_USER: elm
      DB_PASSWORD: elm
      DB_NAME: elm_practice_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: "初始化测试库结构与种子"
        run: |
          mysql -h127.0.0.1 -uelm -pelm elm_practice_test < database/schema/schema.sql
          mysql -h127.0.0.1 -uelm -pelm elm_practice_test < database/seed/seed.sql
      - run: mvn -B test
