# 统一端口口径 4000（BUG-20260908-007：8080 在服务器被 gunicorn 占用；服务器由命令行 --server.port 同值覆盖）
server.port=4000
server.servlet.context-path=/
server.servlet.session.timeout=30m
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ---- MySQL 数据源（连接参数经环境变量注入，密码不入仓库；默认指向本机，部署时设置 DB_* 覆盖） ----
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:3306/${DB_NAME:elm_practice}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:elm}
spring.datasource.password=${DB_PASSWORD:}

# ---- MyBatis ----
mybatis.configuration.map-underscore-to-camel-case=true

# 二阶段图片上传目录（服务器可用 FILE_UPLOAD_DIR 覆盖）
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
