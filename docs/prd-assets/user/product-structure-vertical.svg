<rect class="leaf" x="166" y="752" width="202" height="56" rx="6" style="stroke:#e3bf86; fill:#fff9ef;"/>
<text class="leaf-text" x="267" y="786">地址管理</text>
<rect class="leaf" x="394" y="752" width="202" height="56" rx="6" style="stroke:#e3bf86; fill:#fff9ef;"/>
<text class="leaf-text" x="495" y="776"><tspan x="495">联系商家</tspan><tspan x="495" dy="21">消息会话</tspan></text>
<rect class="leaf" x="622" y="752" width="202" height="56" rx="6" style="stroke:#e3bf86; fill:#fff9ef;"/>
<text class="leaf-text" x="723" y="786">收藏</text>
<rect class="leaf" x="166" y="826" width="202" height="56" rx="6" style="stroke:#e3bf86; fill:#fff9ef;"/>
