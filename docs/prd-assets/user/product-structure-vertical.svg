<rect class="leaf" x="622" y="1002" width="202" height="56" rx="6" style="stroke:#d6a3ab; fill:#fff6f7;"/>
<text class="leaf-text" x="723" y="1026"><tspan x="723">商品维护</tspan><tspan x="723" dy="21">分类管理</tspan></text>
<rect class="leaf" x="166" y="1076" width="202" height="56" rx="6" style="stroke:#d6a3ab; fill:#fff6f7;"/>
<text class="leaf-text" x="267" y="1100"><tspan x="267">店铺设置</tspan><tspan x="267" dy="21">营业状态</tspan></text>
<rect class="leaf" x="394" y="1076" width="202" height="56" rx="6" style="stroke:#d6a3ab; fill:#fff6f7;"/>
<text class="leaf-text" x="495" y="1110">优惠配置</text>
<rect class="leaf" x="622" y="1076" width="202" height="56" rx="6" style="stroke:#d6a3ab; fill:#fff6f7;"/>
<text class="leaf-text" x="723" y="1100"><tspan x="723">消息会话</tspan><tspan x="723" dy="21">评价回复</tspan></text>
<circle class="branch-dot" cx="92" cy="1252" r="5"/>
<path class="branch" d="M92 1252 H140"/>
<rect class="module" x="140" y="1182" width="710" height="220" rx="8" stroke="#4f7188"/>
<path d="M148 1182 H842 A8 8 0 0 1 850 1190 V1232 H140 V1190 A8 8 0 0 1 148 1182 Z" fill="#4f7188"/>
<text class="module-title" x="166" y="1215">公共能力与交付</text>
<rect class="leaf" x="166" y="1252" width="316" height="56" rx="6" style="stroke:#a8bbc7; fill:#f5f8fa;"/>
<text class="leaf-text" x="324" y="1286">账号与角色入口</text>
<rect class="leaf" x="508" y="1252" width="316" height="56" rx="6" style="stroke:#a8bbc7; fill:#f5f8fa;"/>
<text class="leaf-text" x="666" y="1286">双版本视觉基线</text>
<rect class="leaf" x="166" y="1326" width="316" height="56" rx="6" style="stroke:#a8bbc7; fill:#f5f8fa;"/>
<text class="leaf-text" x="324" y="1350"><tspan x="324">后端接口约定</tspan><tspan x="324" dy="21">联调验收</tspan></text>
<rect class="leaf" x="508" y="1326" width="316" height="56" rx="6" style="stroke:#a8bbc7; fill:#f5f8fa;"/>
<text class="leaf-text" x="666" y="1360">静态页面版</text>
<text class="leaf-text" x="450" y="1462">用户端主链路与商家端订单、商品、营业状态保持联动</text>
<text class="leaf-text" x="450" y="1490">金额以后端计算结果为准；演示固定 5 家商家，主演示商家为肯德基宅急送</text>
</svg>