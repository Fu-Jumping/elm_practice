<rect class="leaf" x="508" y="326" width="316" height="56" rx="6" style="stroke:#a9c7e8; fill:#f5f9fe;"/>
<text class="leaf-text" x="666" y="360">搜索结果汇总</text>
<circle class="branch-dot" cx="92" cy="502" r="5"/>
<path class="branch" d="M92 502 H140"/>
<rect class="module" x="140" y="432" width="710" height="220" rx="8" stroke="#3c8c78"/>
<path d="M148 432 H842 A8 8 0 0 1 850 440 V482 H140 V440 A8 8 0 0 1 148 432 Z" fill="#3c8c78"/>
<text class="module-title" x="166" y="465">用户端-交易链路</text>
