<rect class="leaf" x="394" y="576" width="202" height="56" rx="6" style="stroke:#9bcaba; fill:#f3faf7;"/>
<text class="leaf-text" x="495" y="600"><tspan x="495">订单列表</tspan><tspan x="495" dy="21">订单详情</tspan></text>
