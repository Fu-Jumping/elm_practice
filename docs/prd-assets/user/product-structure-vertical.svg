<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1530" viewBox="0 0 900 1530" role="img" aria-labelledby="title desc">
<title id="title">外卖平台课程实践项目产品结构图</title>
<desc id="desc">从项目根节点向下展开用户端浏览搜索、交易链路、服务能力、商家端经营能力与公共能力五个模块的纵向结构图。</desc>
<defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#16324f" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill: #ffffff; }
      .title { fill: #16324f; font: 700 26px "Microsoft YaHei", "PingFang SC", sans-serif; text-anchor: middle; }
      .root-box { fill: #245b8f; stroke: #17456f; stroke-width: 2; }
      .root-text { fill: #ffffff; font: 700 22px "Microsoft YaHei", "PingFang SC", sans-serif; text-anchor: middle; }
      .module { fill: #ffffff; stroke-width: 2; filter: url(#shadow); }
      .module-title { fill: #ffffff; font: 700 19px "Microsoft YaHei", "PingFang SC", sans-serif; }
      .leaf { fill: #ffffff; stroke-width: 1.5; }
      .leaf-text { fill: #24384a; font: 15px "Microsoft YaHei", "PingFang SC", sans-serif; text-anchor: middle; }
      .branch { fill: none; stroke: #7794ad; stroke-width: 2; }
      .branch-dot { fill: #245b8f; }
    </style>
  </defs>
<rect class="canvas" width="900" height="1530"/>
<text class="title" x="450" y="38">产品结构图</text>
<rect class="root-box" x="100" y="66" width="700" height="88" rx="8"/>
<text class="root-text" x="450" y="103"><tspan x="450">外卖平台</tspan><tspan x="450" dy="30">课程实践项目</tspan></text>
<path class="branch" d="M450 154 V182 H92 V1384"/>
<circle class="branch-dot" cx="92" cy="252" r="5"/>
<path class="branch" d="M92 252 H140"/>
<rect class="module" x="140" y="182" width="710" height="220" rx="8" stroke="#4f86c6"/>
<path d="M148 182 H842 A8 8 0 0 1 850 190 V232 H140 V190 A8 8 0 0 1 148 182 Z" fill="#4f86c6"/>
<text class="module-title" x="166" y="215">用户端-浏览与搜索</text>
<rect class="leaf" x="166" y="252" width="316" height="56" rx="6" style="stroke:#a9c7e8; fill:#f5f9fe;"/>
<text class="leaf-text" x="324" y="286">首页推荐</text>
<rect class="leaf" x="508" y="252" width="316" height="56" rx="6" style="stroke:#a9c7e8; fill:#f5f9fe;"/>
