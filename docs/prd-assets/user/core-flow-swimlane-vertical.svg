<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="2300" viewBox="0 0 1260 2300" role="img" aria-labelledby="title desc">
<title id="title">外卖平台课程实践项目核心流程泳道图</title>
<desc id="desc">五条纵向泳道展示用户下单支付、商家接单与跨端状态联动、评价与消息双端闭环的核心流程。</desc>
<defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f78a8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c47b18"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#18364d" flood-opacity="0.13"/>
    </filter>
    <style>
      .canvas { fill: #ffffff; }
      .title { fill: #16324f; font: 700 27px "Microsoft YaHei", "PingFang SC", sans-serif; text-anchor: middle; }
      .lane-bg-a { fill: #fbfdff; } .lane-bg-b { fill: #f5f8fb; }
      .lane-line { stroke: #c7d3dc; stroke-width: 1.5; }
      .lane-head { fill: #315f7e; }
      .lane-title { fill: #ffffff; font: 700 17px "Microsoft YaHei", "PingFang SC", sans-serif; text-anchor: middle; }
      .phase { fill: #dbeaf4; }
      .phase-text { fill: #204c69; font: 700 17px "Microsoft YaHei", "PingFang SC", sans-serif; text-anchor: middle; }
      .task { fill: #ffffff; stroke: #4b83a8; stroke-width: 1.7; filter: url(#shadow); }
      .task-text { fill: #24384a; font: 15px "Microsoft YaHei", "PingFang SC", sans-serif; text-anchor: middle; }
      .decision { fill: #eaf4fb; stroke: #2f78a8; stroke-width: 1.8; filter: url(#shadow); }
      .decision-text { fill: #1f4f70; font: 700 14px "Microsoft YaHei", "PingFang SC", sans-serif; text-anchor: middle; }
      .flow { fill: none; stroke: #2f78a8; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .exception { fill: none; stroke: #c47b18; stroke-width: 2.1; stroke-dasharray: 7 6; marker-end: url(#arrow-orange); }
      .label { fill: #486174; font: 13px "Microsoft YaHei", "PingFang SC", sans-serif; }
      .label-warn { fill: #a26314; font: 13px "Microsoft YaHei", "PingFang SC", sans-serif; }
      .legend { fill: #ffffff; stroke: #b8c7d2; stroke-width: 1.2; }
    </style>
  </defs>
<rect class="canvas" width="1260" height="2300"/>
<text class="title" x="630" y="38">外卖平台核心业务流程泳道图</text>
