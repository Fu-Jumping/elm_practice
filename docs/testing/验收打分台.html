<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>验收打分台 · elm 轻量外卖（逐条核验 + 手动测试 + 评分）</title>
<style>
:root{--navy:#063866;--deep:#042747;--blue:#006ab4;--ice:#e8f2f9;--gold:#c9a365;--ink:#17324a;--paper:#f5f8fb;--line:#d8e4ee;--ok:#1e7b3c;--warn:#b26a00;--bad:#b3261e;--na:#7d95ab}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:200;background:linear-gradient(90deg,var(--deep),var(--navy));color:#fff;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:15px;font-weight:700}
.top .sub{font-size:11px;color:#bcd6ea}
.top .spacer{flex:1}
.tbtn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;border-radius:6px;padding:3px 12px;font-size:12px}
.tbtn:hover{background:rgba(255,255,255,.25)}
.prog{min-width:160px;height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#e5d3ae);width:0}
.prog-txt{font-size:11px;color:#bcd6ea;font-variant-numeric:tabular-nums}
.layout{display:flex;min-height:calc(100vh - 46px)}
.side{width:216px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px 0;overflow-y:auto;max-height:calc(100vh - 46px);position:sticky;top:46px}
.side .grp{padding:6px 14px 2px;font-size:11px;color:var(--gold);font-weight:700;letter-spacing:1px}
.side a{display:flex;justify-content:space-between;align-items:center;padding:5px 14px;font-size:12.5px;color:var(--ink);text-decoration:none;border-left:3px solid transparent}
.side a:hover{background:var(--ice)}
.side a.on{background:var(--ice);border-left-color:var(--navy);color:var(--navy);font-weight:600}
.side a .st{font-size:10px;color:#999}
.side a .st.done{color:var(--ok)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.cp{padding:16px 20px 40px;max-width:860px}
.cp-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cp-head .no{font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:0 6px;font-weight:700}
.cp-head h2{font-size:18px;color:var(--navy)}
.cp-head .refs{font-size:11px;color:#7d95ab}
.test-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:12px 0}
.test-bar .lbl{font-size:12px;color:#7d95ab}
.tbtn2{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:6px;padding:4px 14px;font-size:12.5px}
.tbtn2:hover{background:#0a4a84}
.tbtn2.ghost{background:#fff;color:var(--navy)}
.test-bar code{font-size:11.5px;background:var(--ice);padding:2px 8px;border-radius:4px;color:var(--blue)}
.frame-panel{display:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px;background:#fff}
.frame-panel.open{display:block}
.frame-panel .fp-head{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--ice);font-size:12px;color:var(--ink)}
.frame-panel .fp-head .x{margin-left:auto;border:none;background:none;color:var(--bad);font-size:16px}
.frame-wrap{position:relative;height:560px}
.frame-wrap iframe{border:0}
.frame-wrap .hint{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;color:#7d95ab;background:repeating-linear-gradient(45deg,#fafcff,#fafcff 12px,#f1f6fb 12px,#f1f6fb 24px);font-size:13px}
.crit{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.crit .c-head{display:flex;align-items:flex-start;gap:8px}
.crit .c-idx{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ice);color:var(--navy);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:1px}
.crit .c-txt{flex:1;font-size:13.5px}
.crit .c-ref{display:block;font-size:11px;color:#7d95ab;margin-top:1px}
.opts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:3px 16px;font-size:12.5px;color:var(--ink)}
.opt:hover{border-color:var(--navy)}
.opt.sel-p{background:#f1faf3;border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.sel-w{background:#fdf7e9;border-color:var(--warn);color:var(--warn);font-weight:700}
.opt.sel-f{background:#fdf2f1;border-color:var(--bad);color:var(--bad);font-weight:700}
.opt.sel-n{background:#f0f3f6;border-color:var(--na);color:var(--na);font-weight:700}
.note-box textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;resize:vertical;font-family:inherit;margin-top:4px}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.nav-row button{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:7px 22px;font-size:13px}
.nav-row button:disabled{opacity:.4;cursor:not-allowed}
.nav-row .next{background:var(--navy);color:#fff}
dialog{border:none;border-radius:12px;padding:0;max-width:720px;width:92%;box-shadow:0 18px 60px rgba(4,39,71,.35);max-height:86vh}
dialog::backdrop{background:rgba(4,39,71,.5)}
.dlg{padding:18px 22px;overflow-y:auto;max-height:86vh}
.dlg h3{color:var(--navy);margin-bottom:10px;font-size:16px}
.sum-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sum-tabs button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 12px;font-size:12px}
.sum-tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
table.sum{width:100%;border-collapse:collapse;font-size:12px}
table.sum th{background:var(--ice);color:var(--navy);text-align:left;padding:6px 8px;position:sticky;top:0}
table.sum td{padding:5px 8px;border-bottom:1px solid #eef3f8}
.tag-p{color:var(--ok);font-weight:700}.tag-w{color:var(--warn);font-weight:700}.tag-f{color:var(--bad);font-weight:700}.tag-n{color:var(--na)}
.md-out{width:100%;min-height:220px;font-family:ui-monospace,monospace;font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:10px}
.dlg .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.toc .jp{display:flex;justify-content:space-between;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;margin-bottom:5px}
@media(max-width:900px){.layout{flex-direction:column}.side{width:100%;max-height:none;position:static;display:flex;flex-wrap:wrap;padding:6px}.side .grp{width:100%}.side a{border-left:none;border-radius:6px}}
</style>
</head>
<body>
<div class="top">
  <h1>验收打分台</h1><span class="sub">elm 轻量外卖 · 逐条核验 + 手动测试 + 打分（localStorage 自动保存）</span>
  <span class="spacer"></span>
  <span class="prog-txt" id="prog-txt">0/0</span>
  <span class="prog"><i id="prog-bar"></i></span>
  <button class="tbtn" onclick="Acc.jumpIndex()">目录</button>
  <button class="tbtn" onclick="Acc.openSummary()">汇总/导出</button>
  <button class="tbtn" onclick="Acc.confirmReset()">清空</button>
</div>
<div class="layout">
  <nav class="side" id="side"></nav>
  <main class="main"><div class="cp" id="cp"></div></main>
</div>
<dialog id="toc"><div class="dlg toc"><h3>目录</h3><div id="toc-body"></div></div></dialog>
<dialog id="summary"><div class="dlg">
  <h3>汇总与导出</h3>
  <div class="sum-tabs" id="sum-tabs">
    <button class="on" data-t="fail">未通过项</button>
    <button data-t="all">全部明细</button>
    <button data-t="md">Markdown 导出</button>
  </div>
  <div id="sum-body"></div>
  <div class="actions">
    <button class="tbtn2" onclick="Acc.copyMd()">复制 Markdown</button>
    <button class="tbtn2 ghost" onclick="Acc.downloadMd()">下载 .md</button>
    <button class="tbtn2 ghost" style="margin-left:auto" onclick="document.getElementById('summary').close()">关闭</button>
  </div>
</div></dialog>
<script>

 {id:'NF-02',title:'部署与兼容',route:'/demo/panorama.html',iframe:'desk',refs:'§8.2',crits:[
  ['三入口 200（/ /user/ /demo/）；4002 双入口','部署'],
  ['商家端 ≥1280px 完整；用户端 390px 正常','§8.2'],
  ['AI 助手线上可用（非 503）','部署']]},
]},
];
/* ============ 运行时 ============ */
const Acc = (() => {
const STORE_KEY = 'acc-score-v1';
const $ = (id) => document.getElementById(id);
const BASE = location.port === '4001' ? '' : 'http://82.157.137.114:4001';
const flat = [];
GROUPS.forEach(g => g.items.forEach(it => { it.group = g.name; flat.push(it); }));
let cur = 0;
let scores = {};
try { scores = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch (e) { scores = {}; }
const save = () => localStorage.setItem(STORE_KEY, JSON.stringify(scores));
const scOf = (id) => scores[id] || (scores[id] = { crits: {}, note: '' });

function totals() {
  let done = 0, total = 0, p = 0, w = 0, f = 0, n = 0;
  flat.forEach(it => it.crits.forEach((c, i) => {
    total++;
    const v = (scores[it.id] || {}).crits && scores[it.id].crits[i];
    if (v) { done++; if (v === 'p') p++; else if (v === 'w') w++; else if (v === 'f') f++; else n++; }
  }));
  return { done, total, p, w, f, n };
}
function renderProgress() {
  const t = totals();
  $('prog-txt').textContent = t.done + '/' + t.total + '（✅' + t.p + ' ⚠️' + t.w + ' ❌' + t.f + ' ➖' + t.n + '）';
  $('prog-bar').style.width = (t.total ? (t.done / t.total * 100) : 0) + '%';
}
function itemState(it) {
  const s = (scores[it.id] || {}).crits || {};
  const n = it.crits.filter((_, i) => s[i]).length;
  return n === 0 ? '' : (n < it.crits.length ? n + '/' + it.crits.length : '✓');
}
function renderSide() {
  let html = '';
  GROUPS.forEach(g => {
    html += '<div class="grp">' + g.name + '</div>';
    g.items.forEach(it => {
      const st = itemState(it);
      html += '<a href="#" data-i="' + flat.indexOf(it) + '" class="' + (flat[cur] === it ? 'on' : '') + '">' + it.id + ' ' + it.title + '<span class="st ' + (st ? 'done' : '') + '">' + st + '</span></a>';
    });
  });
  $('side').innerHTML = html;
  $('side').querySelectorAll('a').forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); go(+a.dataset.i); }));
}
const OPT_LABELS = { p: '✅ 通过', w: '⚠️ 部分通过', f: '❌ 不通过', n: '➖ 无法验证' };
function render() {
  const it = flat[cur];
  const s = scOf(it.id);
  const route = it.route;
  let html = '<div class="cp-head"><span class="no">' + it.id + '</span><h2>' + it.title + '</h2><span class="refs">' + it.group + ' · ' + it.refs + '</span></div>'
    + '<div class="test-bar"><span class="lbl">手动测试：</span>'
    + '<button class="tbtn2" data-open="1">▶ 页面内嵌打开</button>'
    + '<button class="tbtn2 ghost" data-open="2">新标签页打开 ↗</button>'
    + '<code>' + route + '</code>'
    + '<span class="lbl" style="margin-left:auto">账号：用户 13800000001/123456 · 商家 merchant-a/123456</span></div>'
    + '<div class="frame-panel" id="frame-panel"><div class="fp-head"><b>被测页面</b><span id="fp-url" style="color:#5b7590;font-size:11px"></span><button class="x" id="fp-close">✕</button></div><div class="frame-wrap" id="frame-wrap"><div class="hint">点击上方「页面内嵌打开」加载<br>（用户端可在内嵌框内直接登录，会话与打分台共享）</div></div></div>';
  it.crits.forEach((c, i) => {
    const sel = (s.crits[i] || '');
    html += '<div class="crit"><div class="c-head"><span class="c-idx">' + (i + 1) + '</span><div class="c-txt">' + c[0] + '<span class="c-ref">依据：' + (c[1] || '—') + '</span></div></div>'
      + '<div class="opts" data-id="' + it.id + '" data-i="' + i + '">'
      + ['p', 'w', 'f', 'n'].map(v => '<button class="opt' + (sel === v ? ' sel-' + v : '') + '" data-v="' + v + '">' + OPT_LABELS[v] + '</button>').join('')
      + '</div></div>';
  });
  html += '<div class="note-box"><textarea placeholder="问题备注 / 截图编号 / 缺陷描述（导出时随行输出）" data-note="' + it.id + '">' + String(s.note || '').replace(/</g, '&lt;') + '</textarea></div>'
    + '<div class="nav-row"><button' + (cur === 0 ? ' disabled' : '') + ' id="prev-btn">← 上一页</button><button class="next"' + (cur === flat.length - 1 ? ' disabled' : '') + ' id="next-btn">下一页 →</button></div>';
  $('cp').innerHTML = html;
  $('cp').querySelectorAll('.opts').forEach(box => {
    box.querySelectorAll('.opt').forEach(btn => btn.addEventListener('click', () => {
      scOf(box.dataset.id).crits[box.dataset.i] = btn.dataset.v;
      save(); render(); renderSide(); renderProgress();
    }));
  });
  const ta = $('cp').querySelector('textarea[data-note]');
  ta.addEventListener('input', () => { scOf(ta.dataset.note).note = ta.value; save(); });
  $('cp').querySelector('[data-open="1"]').addEventListener('click', () => openFrame(route, it.iframe === 'phone'));
  $('cp').querySelector('[data-open="2"]').addEventListener('click', () => window.open(BASE + route, '_blank'));
  $('fp-close').addEventListener('click', closeFrame);
  $('prev-btn').addEventListener('click', () => go(cur - 1));
  $('next-btn').addEventListener('click', () => go(cur + 1));
  window.scrollTo(0, 0);
}
function go(i) { cur = Math.max(0, Math.min(flat.length - 1, i)); render(); renderSide(); closeFrame(); }
function openFrame(route, isPhone) {
  const wrap = $('frame-wrap');
  wrap.innerHTML = '';
  if (isPhone) {
    const holder = document.createElement('div');
    holder.style.cssText = 'position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:8px 0';
    const phone = document.createElement('div');
    phone.style.cssText = 'width:390px;height:640px;position:relative;box-shadow:0 4px 18px rgba(4,39,71,.18);border-radius:14px;overflow:hidden;background:#fff;flex:none';
    const fr = document.createElement('iframe');
    fr.src = BASE + route;
    fr.style.cssText = 'position:absolute;left:0;top:0;width:390px;height:640px;border:0;transform:scale(0.82);transform-origin:0 0';
    phone.appendChild(fr); holder.appendChild(phone); wrap.appendChild(holder);
  } else {
    const fr = document.createElement('iframe');
    fr.src = BASE + route;
    fr.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0';
    wrap.appendChild(fr);
  }
  $('fp-url').textContent = BASE + route;
  $('frame-panel').classList.add('open');
}
function closeFrame() {
  const p = $('frame-panel');
  if (p) { p.classList.remove('open'); $('frame-wrap').innerHTML = '<div class="hint">…</div>'; }
}
function jumpIndex() {
  let html = '';
  GROUPS.forEach(g => {
    html += '<div class="grp" style="color:var(--gold);font-size:11px;font-weight:700;padding:6px 0 2px">' + g.name + '</div>';
    g.items.forEach(it => {
      const st = itemState(it);
      html += '<button class="jp" data-i="' + flat.indexOf(it) + '">' + it.id + ' ' + it.title + '<span style="color:' + (st ? 'var(--ok)' : '#999') + '">' + (st || '未评') + '</span></button>';
    });
  });
  $('toc-body').innerHTML = html;
  $('toc-body').querySelectorAll('.jp').forEach(b => b.addEventListener('click', () => { $('toc').close(); go(+b.dataset.i); }));
  $('toc').showModal();
}
function sumTab(t) {
  const body = $('sum-body');
  $('sum-tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if (t === 'md') { body.innerHTML = '<textarea class="md-out" id="md-out" readonly>' + buildMd().replace(/</g, '&lt;') + '</textarea>'; return; }
  let rows = '';
  flat.forEach(it => {
    const s = (scores[it.id] || {}).crits || {};
    it.crits.forEach((c, i) => {
      const v = s[i] || '';
      if (t === 'fail' && !(v === 'f' || v === 'w')) return;
      rows += '<tr><td>' + it.id + '</td><td>' + it.title + '</td><td>' + c[0] + '</td><td class="tag-' + (v || 'n') + '">' + (v ? ({ p: '通过', w: '部分', f: '不通过', n: '无法验证' })[v] : '未评') + '</td></tr>';
    });
  });
  const tt = totals();
  body.innerHTML = '<p style="font-size:12.5px;margin-bottom:8px">总判据 ' + tt.total + ' · 已评 ' + tt.done + ' · ✅' + tt.p + ' ⚠️' + tt.w + ' ❌' + tt.f + ' ➖' + tt.n + '</p>'
    + '<table class="sum"><thead><tr><th>ID</th><th>页面</th><th>判据</th><th>结论</th></tr></thead><tbody>' + (rows || '<tr><td colspan=4 style="color:#999">（暂无）</td></tr>') + '</tbody></table>';
}
function openSummary() { sumTab('fail'); $('summary').showModal(); }
function buildMd() {
  const tt = totals();
  let md = '# 验收打分记录（' + new Date().toLocaleString('sv-SE') + '）\n\n总判据 ' + tt.total + ' · 已评 ' + tt.done + ' · ✅' + tt.p + ' ⚠️' + tt.w + ' ❌' + tt.f + ' ➖' + tt.n + '\n';
  GROUPS.forEach(g => {
    md += '\n## ' + g.name + '\n';
    g.items.forEach(it => {
      const s = (scores[it.id] || {}).crits || {};
      const note = (scores[it.id] || {}).note || '';
      md += '\n### ' + it.id + ' ' + it.title + '（' + it.route + '）\n';
      it.crits.forEach((c, i) => {
        const v = s[i] || '';
        const mark = v === 'p' ? '✅' : v === 'w' ? '⚠️' : v === 'f' ? '❌' : v === 'n' ? '➖' : '⬜';
        const label = v ? ({ p: '通过', w: '部分通过', f: '不通过', n: '无法验证' })[v] : '未评';
        md += '- [' + mark + '] ' + c[0] + '（' + (c[1] || '—') + '）→ ' + label + '\n';
      });
      if (note) md += '- 备注：' + note + '\n';
    });
  });
  return md;
}
function copyMd() { navigator.clipboard.writeText(buildMd()).then(() => alert('已复制到剪贴板')); }
function downloadMd() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buildMd()], { type: 'text/markdown' }));
  a.download = '验收打分-' + new Date().toISOString().slice(0, 10) + '.md';
  a.click();
}
function confirmReset() { if (confirm('清空全部打分与备注？（不可恢复）')) { scores = {}; save(); render(); renderSide(); renderProgress(); } }
document.addEventListener('keydown', (e) => {
  if (e.target.closest('textarea,input') || document.querySelector('dialog[open]')) return;
  if (e.key === 'ArrowRight') go(cur + 1);
  else if (e.key === 'ArrowLeft') go(cur - 1);
});
$('sum-tabs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => sumTab(b.dataset.t)));
function init() { render(); renderSide(); renderProgress(); }
return { go, openFrame, closeFrame, jumpIndex, openSummary, sumTab, copyMd, downloadMd, confirmReset, init };
})();
window.Acc = Acc;
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', Acc.init);
else Acc.init();
</script>
