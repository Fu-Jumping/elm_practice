<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Empty States Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=PingFang+SC:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#f8f9ff",
                        "surface-container-low": "#f1f3fc",
                        "inverse-on-surface": "#eef1f9",
                        "on-secondary-container": "#6a4600",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-variant": "#dfe2eb",
                        "surface-container-high": "#e5e8f0",
                        "tertiary": "#006d37",
                        "on-tertiary-container": "#003316",
                        "on-error-container": "#93000a",
                        "on-background": "#181c22",
                        "primary-fixed-dim": "#ffb59e",
                        "secondary": "#815600",
                        "primary-fixed": "#ffdbd0",
                        "on-surface-variant": "#5b4038",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#6add8d",
                        "secondary-fixed-dim": "#ffba4b",
                        "tertiary-fixed": "#86faa7",
                        "on-primary-container": "#541400",
                        "on-secondary-fixed-variant": "#624000",
                        "surface-tint": "#ae3200",
                        "surface-container": "#ebeef6",
                        "outline-variant": "#e4beb3",
                        "secondary-fixed": "#ffddb1",
                        "on-primary-fixed": "#3a0b00",
                        "secondary-container": "#fdaf1e",
                        "surface": "#f8f9ff",
                        "on-secondary-fixed": "#291800",
                        "primary": "#ae3200",
                        "on-primary-fixed-variant": "#852400",
                        "tertiary-container": "#2da65d",
                        "primary-container": "#ff5a1f",
                        "on-tertiary-fixed-variant": "#005228",
                        "surface-dim": "#d7dae2",
                        "background": "#f8f9ff",
                        "on-tertiary-fixed": "#00210c",
                        "inverse-primary": "#ffb59e",
                        "on-surface": "#181c22",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "outline": "#8f7067",
                        "inverse-surface": "#2d3137",
                        "surface-container-highest": "#dfe2eb",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "module-gap": "12px",
                        "item-gap": "8px",
                        "card-padding": "12px",
                        "page-margin": "16px"
                    },
                    "fontFamily": {
                        "card-title": ["PingFang SC"],
                        "section-title": ["PingFang SC"],
                        "currency-display": ["PingFang SC"],
                        "page-title": ["PingFang SC"],
                        "caption-muted": ["PingFang SC"],
                        "body-main": ["PingFang SC"],
                        "label-table": ["PingFang SC"]
                    },
                    "fontSize": {
                        "card-title": ["15px", { "lineHeight": "22px", "fontWeight": "600" }],
                        "section-title": ["18px", { "lineHeight": "26px", "fontWeight": "700" }],
                        "currency-display": ["15px", { "lineHeight": "22px", "fontWeight": "700" }],
                        "page-title": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "caption-muted": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-main": ["15px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "label-table": ["13px", { "lineHeight": "18px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 300,
                'GRAD' 0,
                'opsz' 48;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-page-margin font-body-main text-on-surface">
<div class="max-w-[1280px] w-full mx-auto">
<div class="grid grid-cols-1 md:grid-cols-3 gap-module-gap">
<!-- Card 1: Product List -->
<div class="bg-surface-container-lowest rounded-xl p-card-padding flex flex-col items-center justify-center min-h-[300px] border border-surface-container-highest shadow-sm">
<div class="w-32 h-32 mb-6 flex items-center justify-center bg-surface-container-low rounded-full">
<span class="material-symbols-outlined text-[64px] text-surface-variant">inventory_2</span>
</div>
<p class="text-[14px] text-[#6b7280] mb-6 font-caption-muted">暂无商品</p>
<button class="bg-primary-container text-on-primary px-6 py-2 rounded-lg font-label-table hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-opacity-50">
                    新增商品
                </button>
</div>
<!-- Card 2: Category Management -->
<div class="bg-surface-container-lowest rounded-xl p-card-padding flex flex-col items-center justify-center min-h-[300px] border border-surface-container-highest shadow-sm">
<div class="w-32 h-32 mb-6 flex items-center justify-center bg-surface-container-low rounded-full">
<span class="material-symbols-outlined text-[64px] text-surface-variant">category</span>
</div>
<p class="text-[14px] text-[#6b7280] mb-6 font-caption-muted">暂无分类</p>
<button class="bg-primary-container text-on-primary px-6 py-2 rounded-lg font-label-table hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-opacity-50">
                    新增分类
                </button>
</div>
<!-- Card 3: Order Management -->
<div class="bg-surface-container-lowest rounded-xl p-card-padding flex flex-col items-center justify-center min-h-[300px] border border-surface-container-highest shadow-sm">
<div class="w-32 h-32 mb-6 flex items-center justify-center bg-surface-container-low rounded-full">
<span class="material-symbols-outlined text-[64px] text-surface-variant">receipt_long</span>
</div>
<p class="text-[14px] text-[#6b7280] mb-6 font-caption-muted">暂无待接单订单</p>
<button class="bg-primary-container text-on-primary px-6 py-2 rounded-lg font-label-table hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-opacity-50 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">refresh</span>
                    刷新
                </button>
</div>
</div>
</div>
</body></html>
