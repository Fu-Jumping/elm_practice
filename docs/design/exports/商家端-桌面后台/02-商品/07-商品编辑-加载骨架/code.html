<style>
        /* Skeleton Shimmer Animation requested in prompt */
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        .skeleton-shimmer {
            animation: shimmer 2s infinite linear;
            background: linear-gradient(to right, #f3f3f3 4%, #e5e5e5 25%, #f3f3f3 36%);
            background-size: 1000px 100%;
        }
    </style>

<body class="bg-background text-on-surface font-body-main antialiased min-h-screen">

<header class="fixed top-0 right-0 h-[56px] left-[220px] bg-surface border-b border-outline-variant flex justify-between items-center px-6 z-10">
<div class="font-section-title text-section-title text-on-surface">
<!-- Space left for potential breadcrumbs or page context in nav if needed, but JSON dictates product name is here. However, typical layout puts breadcrumbs in content. We follow JSON strictly for components. -->
</div>
<div class="flex items-center gap-6">

<span class="font-label-table text-label-table text-tertiary-container flex items-center gap-1">
<span class="w-2 h-2 rounded-full bg-tertiary-container block"></span>

</button>
</div>
</header>

<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center overflow-hidden shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">storefront</span>
</div>
<div class="flex flex-col">
<span class="font-section-title text-section-title text-primary truncate w-[140px]" title="校园外卖商家后台">校园外卖商家后台</span>

</div>

<span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
<span class="font-body-main text-body-main">订单</span>
</a>
<!-- Index 1 (Active) -->
<a class="flex items-center gap-3 px-3 py-3 rounded-lg text-primary bg-secondary-container font-bold border-r-4 border-primary transition-colors duration-200" href="#">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
<span class="font-body-main text-body-main">商品</span>
</a>
<!-- Index 2 -->

<span class="material-symbols-outlined" data-icon="category">category</span>
<span class="font-body-main text-body-main">分类</span>

<!-- Index 3 -->

<span class="font-body-main text-body-main">店铺设置</span>

<span class="material-symbols-outlined text-[20px]" data-icon="dashboard">dashboard</span>
<span class="font-caption-muted text-caption-muted">概览 (二期)</span>
