<!-- Header (Search Bar) -->
<header class="sticky top-0 z-50 flex items-center px-margin-page h-14 w-full bg-surface-white border-b border-border-light">
<button aria-label="返回" class="mr-2 text-secondary p-1 rounded-full active:bg-surface-container">

</button>
<div class="flex-1 flex items-center bg-surface-container-low rounded-lg px-3 py-2">
<span class="material-symbols-outlined text-secondary text-[20px] mr-2">search</span>

</div>
<button class="ml-3 font-body-lg text-primary-container active:opacity-70 whitespace-nowrap">搜索</button>
</header>
<main class="flex-1 px-margin-page py-gap-module space-y-6">
<!-- Section 1: 最近搜索 (Recent Searches) -->
<section>
<div class="flex justify-between items-center mb-3">
<h2 class="font-headline-md text-headline-md text-on-surface">最近搜索</h2>
<button aria-label="清除最近搜索" class="text-secondary p-1 rounded-full active:bg-surface-container">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<div class="flex flex-wrap gap-2">
<span class="px-3 py-1.5 bg-surface-container-low rounded text-body-md text-secondary active:bg-surface-container transition-colors">肯德基</span>

<span class="px-3 py-1.5 bg-surface-container-low rounded text-body-md text-secondary active:bg-surface-container transition-colors">汉堡</span>
<span class="px-3 py-1.5 bg-surface-container-low rounded text-body-md text-secondary active:bg-surface-container transition-colors">披萨</span>
</div>
</section>
<!-- Section 2: 热门搜索 (Hot Searches) -->
<section>
<h2 class="font-headline-md text-headline-md text-on-surface mb-4">热门搜索</h2>
<div class="grid grid-cols-2 gap-y-4 gap-x-6">
<!-- Item 1 -->
<div class="flex items-center space-x-2">
<span class="font-headline-md text-headline-md text-[#FF3B30] w-5 text-center">1</span>
<span class="font-body-md text-on-surface flex-1 truncate">麻辣烫</span>
<span class="px-1 py-0.5 rounded-sm bg-error-container text-error font-label-sm text-label-sm">HOT</span>
</div>
<!-- Item 2 -->
<div class="flex items-center space-x-2">
<span class="font-headline-md text-headline-md text-[#FF9500] w-5 text-center">2</span>
<span class="font-body-md text-on-surface flex-1 truncate">奶茶</span>
</div>
<!-- Item 3 -->
<div class="flex items-center space-x-2">
<span class="font-headline-md text-headline-md text-[#FFCC00] w-5 text-center">3</span>
<span class="font-body-md text-on-surface flex-1 truncate">烧烤</span>
<span class="px-1 py-0.5 rounded-sm bg-error-container text-error font-label-sm text-label-sm">HOT</span>
</div>
<!-- Item 4 -->

<span class="font-headline-md text-headline-md text-text-tertiary w-5 text-center">4</span>
<span class="font-body-md text-on-surface flex-1 truncate">炸鸡</span>

<!-- Item 5 -->

<span class="font-headline-md text-headline-md text-text-tertiary w-5 text-center">5</span>
<span class="font-body-md text-on-surface flex-1 truncate">寿司</span>
</div>
<!-- Item 6 -->
<div class="flex items-center space-x-2">
<span class="font-headline-md text-headline-md text-text-tertiary w-5 text-center">6</span>
<span class="font-body-md text-on-surface flex-1 truncate">饺子</span>
</div>
<!-- Item 7 -->
<div class="flex items-center space-x-2">
<span class="font-headline-md text-headline-md text-text-tertiary w-5 text-center">7</span>
