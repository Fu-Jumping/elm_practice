<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title class="">饿了么 - 注册</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                        "on-secondary-container": "#656464",
                        "on-primary-container": "#541400",

                        "on-secondary": "#ffffff",

                    "borderRadius": {

                    "fontFamily": {

<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center">
<!-- Mobile Container -->
<div class="w-full max-w-[480px] min-h-screen bg-surface-white relative shadow-sm border-x border-border-light">
<!-- TopAppBar (Transactional - Hidden Global Nav Logic overrides TopAppBar if intent is purely transactional, but user requested a specific TopNav with Back button) -->
<header class="sticky top-0 z-50 flex items-center justify-between px-margin-page h-14 w-full bg-surface border-b border-border-light transition-colors duration-200">
<button class="text-on-surface hover:bg-secondary-container/50 p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface absolute left-1/2 -translate-x-1/2">注册账号</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="px-margin-page py-6 flex flex-col gap-gap-module">
<div class="text-center mb-8 mt-4">
<h2 class="font-headline-lg text-headline-lg text-primary mb-2">饿了么</h2>
<p class="font-body-md text-body-md text-text-secondary">欢迎加入，发现校园美食</p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-5">
<!-- Phone Number -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="phone">手机号</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-text-tertiary text-[20px]" data-icon="phone_iphone">phone_iphone</span>
<input class="w-full h-12 pl-10 pr-4 bg-surface-bright border border-border-light rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-text-tertiary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="phone" placeholder="请输入手机号" type="tel">
</div>
</div>
<!-- Nickname -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="nickname">昵称</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-text-tertiary text-[20px]" data-icon="person">person</span>
<input class="w-full h-12 pl-10 pr-4 bg-surface-bright border border-border-light rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-text-tertiary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="nickname" placeholder="设置你的昵称" type="text">
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="password">密码</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-text-tertiary text-[20px]" data-icon="lock">lock</span>
<input class="w-full h-12 pl-10 pr-10 bg-surface-bright border border-border-light rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-text-tertiary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" placeholder="设置6-20位密码" type="password">
<button class="absolute right-3 text-text-tertiary flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="confirm-password">确认密码</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-text-tertiary text-[20px]" data-icon="lock_reset">lock_reset</span>
<input class="w-full h-12 pl-10 pr-10 bg-surface-bright border border-border-light rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-text-tertiary focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="confirm-password" placeholder="再次输入密码" type="password">
<button class="absolute right-3 text-text-tertiary flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-2 mt-2">
<input class="mt-1 w-4 h-4 text-primary bg-surface-bright border-border-light rounded-sm focus:ring-primary focus:ring-offset-0" id="terms" type="checkbox">
<label class="font-label-md text-label-md text-text-secondary leading-snug" for="terms">
                        我已阅读并同意 <a class="text-primary hover:underline" href="#">《用户服务协议》</a> 和 <a class="text-primary hover:underline" href="#">《隐私政策》</a>
</label>
</div>
<!-- Primary Action Button -->
<button class="mt-6 w-full h-12 bg-primary-container text-on-primary font-cta-button text-cta-button rounded-DEFAULT active:scale-[0.98] transition-transform flex items-center justify-center" type="button">
                    立即注册
                </button>
</form>
<!-- Bottom Link -->
<div class="mt-8 text-center">
<a class="font-body-md text-body-md text-text-secondary hover:text-primary transition-colors" href="#">
                    已有账号？去登录
                </a>
</div>
</main>
</div>


</body></html>
