<script>
        // Star Rating Interaction
        const stars = document.querySelectorAll('#star-rating span');
        const ratingText = document.getElementById('rating-text');
        const ratingTexts = ["极差", "较差", "一般", "满意", "非常好"];

        stars.forEach(star => {
            star.addEventListener('click', (e) => {
                const rating = parseInt(e.target.dataset.rating);
                stars.forEach((s, index) => {
                    if (index < rating) {
                        s.classList.remove('star-inactive');
                        s.classList.add('star-active');
                    } else {
                        s.classList.remove('star-active');
                        s.classList.add('star-inactive');
                    }
                });
                ratingText.textContent = ratingTexts[rating - 1];
            });
        });

        // Tags Interaction
        const tagBtns = document.querySelectorAll('.tag-btn');
        tagBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.classList.contains('border-primary-container')) {
                    btn.classList.remove('border-primary-container', 'bg-primary-fixed', 'text-primary-container');
                    btn.classList.add('border-border-light', 'bg-surface-container-lowest', 'text-text-secondary');
                } else {
                    btn.classList.remove('border-border-light', 'bg-surface-container-lowest', 'text-text-secondary');
                    btn.classList.add('border-primary-container', 'bg-primary-fixed', 'text-primary-container');
                }
            });
        });
    </script>
