# SRS v0.1 软件需求规格说明（2026-09-03 初稿）

## 0 效力、写作纪律与分工
### 唯一需求源：docs/PRD.md
- 不新增产品范围
### 接口口径：后端接口契约
- 只做模块映射与系统级约束
### 设计口径：docs/design/**
### 测试口径：TDD实施规划
- 每条 P0 需求覆盖正常/缺参/未登录/越权/不存在/冲突
### 真实性口径
- 无真实证据只能标"规划/待验证"
### 章节分工
- §1-2 组长成员E（组长）；§3-7 后端B成员A（后端B）
- §8 成员A（后端B）主笔+成员D（商家端/测试）共创；终审组长

## 1 引言
### 1.1 编写目的
- 四端同一实现口径（H5/后台/Java/DB）
### 1.2 P0 范围（六类闭环）
- 用户注册登录注销个人信息
- 商家注册登录店铺开关
- 浏览店铺分类商品；商家维护
- 地址增删改查与默认地址
- 购物车增删改查
- 订单创建列表详情明细
- P0 订单状态单一 PROCESSING
### 1.3 不在本阶段范围
- 客服/真实支付/骑手地图/复杂RBAC/微服务/退款资金
### 1.4 术语
- P0/P1、Mock、real、Session、快照、cartLineId
### 1.6 版本记录
- v0.1 2026-09-03 可评审初稿

## 2 需求追踪矩阵（13 条 FR）
### FR-ACC-01 用户注册
- PRD 7.1 / 契约3.1 POST /users / TC-ACC-001~007
### FR-ACC-02 用户会话
- PRD 7.1 / login、logout、/me、PATCH /me / TC-ACC-008~012
### FR-MER-01 商家注册开店
- PRD 7.2 / POST /merchants / TC-MER-001~006
### FR-MER-02 商家登录店铺维护
- PRD 7.2、7.13 / 契约4.1 / TC-MER-007~012
### FR-STO-01 用户浏览
- PRD 7.3 / GET /stores/**、/products/{id} / TC-STO-001~008
### FR-ADR-01 地址管理
- PRD 7.5 / /me/addresses/** / TC-ADR-001~009
### FR-CAT-01 分类管理
- PRD 7.12 / /merchant/categories / TC-CAT-001~008
### FR-PRD-01 商品管理
- PRD 7.12 / /merchant/products / TC-PRD-001~014
### FR-CART-01 购物车
- PRD 7.4 / /cart、/cart/items / TC-CRT-001~010
### FR-ORD-01 订单创建
- PRD 7.6 / POST /orders / TC-ORD-001~012
### FR-ORD-02 订单查询
- PRD 7.6 / GET /orders/** / TC-ORD-013~020
### FR-MORD-01 商家订单查询
- PRD 7.16.2 / GET /merchant/orders/** / 9/4 首批失败测试
### FR-PAY-01 模拟支付
- PRD 7.7 / POST /orders/{id}/payment / P1 未纳入 P0

## 3 总体描述
### 3.1 角色与权限
- 双 Session：user_session / merchant_session
- 未登录 401；角色不匹配 403
- 归属不匹配 404，不泄露资源存在
- 不信任请求体 userId/merchantId/storeId
### 3.2 系统上下文
- H5(Vue3):5173 → Spring Boot:4000 → MySQL:3306；后台(React18):4001
- 单仓库三目录
### 3.3 运行环境
- 用户端 5173 / 商家端 4001 / 后端 4000 / MySQL 3306
- 联调禁止 Mock 回退
### 3.4 全局业务约束（10 条）
- 1 /api/v1 前缀；商家 /api/v1/merchant
- 2 成功 {code:0, message, data}
- 3 空列表返回 data:[] 不是错误
- 4 东八区 yyyy-MM-dd HH:mm:ss
- 5 金额单位元、后端算、两位小数
- 6 P0 实付 = 小计 + 打包费 2.00
- 7 订单存商品/地址/金额快照+创建时间
- 8 下单同事务：头+明细+快照+清购物车
- 9 数量库存非负；下架/不足禁加购下单
- 10 密码不入响应/日志/提交文件

## 4 功能需求（13 条 FR）
### 4.1 账号与角色
#### FR-ACC-01 用户注册
- 正常：合法注册成功；重复账号 409
- 异常：缺参/格式错 400；重复提交不产生第二个账号
#### FR-ACC-02 用户会话
- 正常：登录写 user_session；GET /me；注销失效
- 异常：账密错 401；未登录 401
#### FR-MER-01 商家注册和登录
- 注册同时建店初始 CLOSED；登录写 merchant_session
- 重复 409；缺参 400；用户 Session 不能进商家接口
### 4.2 店铺、分类和商品
#### FR-STO-01 用户浏览
- 关键词/分类/排序查询；无数据返回空数组
- 下架商品不显示可购；关闭店铺禁入下单链路
#### FR-MER-02 店铺设置
- 只能改自己绑定店铺；改后用户端可见
- 状态切换失败不得提前展示成功
#### FR-CAT-01 分类管理
- 同店铺名称唯一，重名 409
- 删仍有商品的分类 409；非本店分类 404
#### FR-PRD-01 商品管理
- 删除只允许下架商品；售中删除 409
- 越权/不存在 404；库存 0 显示售罄禁加购
### 4.3 地址
#### FR-ADR-01 地址管理
- 最多一个默认；删默认后按契约重设最近一条
- 他人地址 404；重复设默认不产生多个默认
### 4.4 购物车
#### FR-CART-01 购物车管理
- 范围=用户+店铺+商品；同商品合并数量
- 数量 0 删该行；非正数或超库存 400
- 商品不存在/下架/不属于店铺 404 或 409
### 4.5 基础订单
#### FR-ORD-01 订单创建
- 后端以当前购物车/商品/库存/店铺重算
- 存订单头+三种快照；状态 PROCESSING
- 成功后清空该用户该店铺购物车
- 拒绝：空车/地址非本人/关店/下架/库存不足/不起送
- 预期金额不一致不得覆盖后端计算
- 事务失败时购物车和订单均保持原状
#### FR-ORD-02 用户订单查询
- 新订单入列表；详情含商品地址金额状态快照
- 他人订单按安全规则 404；空列表返回 []
#### FR-MORD-01 商家订单查询
- 只查绑定店铺订单；用户访问 403
- 他店订单不可见；非法筛选 400

## 5 数据需求
### 5.1 实体与关系（9 实体）
- user、merchant、store、category、product
- address、cart_item、order、order_item
- merchant 1:1 store；store 1:N category/product
- user 1:N address/cart_item/order；order 1:N order_item
### 5.2 P0 数据字典
- 用户：account 唯一；仅存 passwordHash
- 店铺：status = OPEN/CLOSED/TEMPORARILY_CLOSED
- 商品：price>=0、stock>=0、onSale
- 订单：totalAmount = productSubtotal + packagingFee
- 订单明细：productName/unitPrice 快照，不依赖当前值
- 对外业务编号稳定；内部主键不暴露
### 5.3 存储与事务
- 建表/种子脚本可重复执行
- 下单事务：校验→写订单快照→扣/锁库存→清购物车
- 失败不留半个订单；统一 409/500 JSON

## 6 接口需求
### 6.1 总则
- UTF-8+JSON；Set-Cookie 建 Session；前端带 credentials
- 成功 2xx+code=0；错误 400/401/403/404/409/500
- 服务端异常也必须返回 JSON，不能吐 HTML
### 6.2 P0 接口分组（8 组）
- 用户账号 3.1 / 店铺商品查询 3.2 / 地址 3.3
- 购物车 3.4 / 用户订单 3.5
- 商家账号店铺 4.1 / 商家分类商品 4.2 / 商家订单 5.1
- 后端调整必须回写契约与 SRS，不允许只改前端
### 6.3 一致性 5 条
- 同字段两端含义一致；状态值不改名
- 订单金额固定三项：商品合计/打包费/实付
- P0 只用 PROCESSING；P1 状态不混入
- 全操作做 Session 身份与归属检查
- 重复操作幂等或明确 409

## 7 非功能需求（NFR-01~10）
### NFR-01 可维护性
- 三端独立工程 + Controller/Service/DAO 分层 / 目录代码检查
### NFR-02 可测试性
- 先失败测试再实现 / Git 顺序+测试报告
### NFR-03 安全
- Session 识别角色、归属校验、密码不入日志 / 权限测试
### NFR-04 一致性
- 金额后端算；订单+购物车事务保护 / 接口测试+DB 记录
### NFR-05 幂等性
- 重复提交不产生重复账号/订单/扣减 / 重复请求测试
### NFR-06 兼容性
- 用户端移动视口；商家端 ≥1280px / 截图验证
### NFR-07 性能
- 本地可交互返回即可，无生产级 SLA / 手工联调记录
### NFR-08 可部署性
- 四件套独立启动；局域网手机可访问 / 构建启动记录
### NFR-09 可追溯性
- PRD/SRS/接口/测试/代码/日志互查 / 文档 Git 检查
### NFR-10 可解释性
- 每人讲清本人模块需求/接口/测试/数据表 / 答辩抽查

## 8 测试与验收
### 8.1 六层测试分层
- 后端单元 / 后端接口 / 用户端 / 商家端
- 集成联调 / 交叉验收
### 8.2 首批失败测试（9/4）
- 先覆盖异常，不是只写成功用例
- 账号：格式/密码/重复注册/错误登录
- 权限：未登录、跨角色、他人资源
- 前提：店铺不存在关闭、商品下架库存不足
- 商品分类：重名、删有商品分类、售中删除
- 地址：非本人、无效字段、默认冲突
- 购物车：非正数、超库存、跨店铺
- 下单：空车、地址非法、金额篡改、重复提交
- 商家订单：越权、非法筛选、不存在
### 8.3 P0 主链路验收（8 步）
- 登录→首页见 m002→进店看商品→加购改删
- →选本人地址→创建订单（验状态/金额/快照）
- →查订单列表详情→商家登录查本店订单
### 通过门槛（5 条）
- Mock 回退关闭，响应来自后端
- 数据库有可解释记录
- 正常+异常测试有输出，不能只展示截图
- 失败无半成功数据；越权读不到他人数据
- 局域网可访问；≥1280px 可操作
### 8.4 证据清单
- SRS/契约/架构图/后端代码/前端代码/联调记录/每日记录

## 9 待确认事项（5 项）
- Spring Boot / MyBatis vs JPA / MySQL 版本
- 架构设计模块划分与 ER 图落点
- P0 是否扣库存（契约与 PRD 决议优先）

- 待确认不得写成已实现
